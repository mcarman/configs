# Tmux Configuration
# Generated with TmuxAI Config Generator
# https://tmuxai.dev

##---- Basic Settings -------------------------------------
## Set leader to <space>
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

##---- Misc. Parameters-------------------------------------
set -g escape-time 500
set -g history-limit 10000
set -g mouse on
set -ga terminal-overrides ",*-256color:Tc"
set -s copy-command 'xsel -i'

##---- Window Management ------------------------------------
bind n new-window -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind l choose-window
setw -g pane-base-index 1
set -g set-titles on
set -g set-titles-string "#{pane_title}"

##---- Use direnv with tmux ------------------------------------------
set-option -g update-environment "DIRENV_DIFF DIRENV_DIR DIRENV_WATCHES"
set-environment -gu DIRENV_DIFF
set-environment -gu DIRENV_DIR
set-environment -gu DIRENV_WATCHES
set-environment -gu DIRENV_LAYOUT

##---- Optional settings, disable if term is funky -------------------
set-option -s focus-events on
set-option -s extended-keys on

##---- Pane Navigation -----------------------------------------------
bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R

##---- Nvim Pane Switching -------------------------------------------

# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
vim_pattern='(\S+/)?g?\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?'
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +${vim_pattern}$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

##---- Make tmux copy similar to nvim --------------------------------
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi enter send-keys -X copy-pipe-and-cancel "pbcopy"
bind P paste-buffer
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key v copy-mode

##---- Status Bar ----------------------------------------------------
set -g status-position bottom
set -g status-interval 5

##---- Styling -------------------------------------------------------
## Nerdfont characters
HALF_ROUND_OPEN="#(printf '\uE0B6')"
HALF_ROUND_CLOSE="#(printf '\uE0B4')"
# TRIANGLE_OPEN="#(printf '\uE0B2')"
# TRIANGLE_CLOSE="#(printf '\uE0B0')"

## Show the window list centered between left and  right sections ----
set-option -g status-justify centre

## Set max length of left and right section
set-option -g status-left-length 100
set-option -g status-right-length 100

