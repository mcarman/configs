# Remove the separator between window list items, as we already have spacing
# "around" inactive items
# set-option -g window-status-separator

# Load catppuccin theme ...
# source-file "$HOME/.config/tmux/themes/catppuccin-mocha.tmux"
set -g @catppuccin_flavor 'mocha' # latte, frappe, macchiato or mocha
set -g @catppuccin_window_status_style "rounded" # basic, slants

# ... and then set status-left & status-right ...
set -g status-left "#{E:@catppuccin_status_session}"
set -g status-right "#{E:@catppuccin_status_pane_id}"
set -ag status-right "#{E:@catppuccin_status_pane_index}"
set -agF status-right "#{E:@catppuccin_status_current_file}"



# -- Plugins -----------------------------------------------

# set plugins for plugins in .local dir
# Install plugins at $HOME/.local/bin/tmux/plugins/tpm/bin/install_plugins
# or with $TPM_DIR/install_plugins
# Update plugins with $HOME/.local/bin/tmux/plugins/tpm/bin/update_plugins all.
# or with $TPM_DIR/update_plugins all
set -g @tpm_plugins '\
    tmux-plugins/tpm \
    christoomey/vim-tmux-navigator \
    jimeh/tmux-themepack \
    catppuccin/tmux \
    tmux-plugins/tmux-yank\
'
# catppuccin/tmux#v2.1.3 may need yo repoad
# plugims located outside of .config folder
run "$HOME/.local/bin/tmux/plugins/tpm/tpm"
