#####--- themes and colors -------------------------------------------

## Call the catppuccin plugin, must be prior to use
RUN ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux

## call catppuccin theme, mocha
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style rounded

## Status line settings
set -g status-right-length 100
set -g status-left-length 100
set -agF status-right "#{@catppuccin_status_gitmux}"
set -agF status-left "#{E:@catppuccin_status_date_time}#{E:@catppuccin_status_directory}"
## set -g status-right '#[fg=#{@thm_crust},bg=#{@thm_teal}] session: #5 '

## catppuccin colors
 styles:
    clear: "#[fg=#{@thm_fg}]"
    state: "#[fg=#{@thm_red},bold]"
    branch: "#[fg=#{@thm_fg},bold]"
    remote: "#[fg=#{@thm_teal}]"
    divergence: "#[fg=#{@thm_fg}]"
    staged: "#[fg=#{@thm_green},bold]"
    conflict: "#[fg=#{@thm_red},bold]"
    modified: "#[fg=#{@thm_yellow},bold]"
    untracked: "#[fg=#{@thm_mauve},bold]"
    stashed: "#[fg=#{@thm_blue},bold]"
    clean: "#[fg=#{@thm_rosewater},bold]"
    insertions: "#[fg=#{@thm_green}]"
    deletions: "#[fg=#{@thm_red}]"

